# General
CONFIG_ZMK_KEYBOARD_NAME="Sofle"

# Bluetooth
CONFIG_BT=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT=y

# Power: idle after 30s, deep sleep after 15min
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Disable RGB underglow entirely
CONFIG_ZMK_RGB_UNDERGLOW=n

# External power control (allows toggling via keymap if needed)
CONFIG_ZMK_EXT_POWER=y

# Encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Display: nice!view has its own custom status screen
# Widget configs are handled by the nice_view shield automatically
CONFIG_ZMK_DISPLAY=y

# Battery reporting over BLE
CONFIG_ZMK_BATTERY_REPORTING=y
