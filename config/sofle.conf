# --- BASIC IDENTITY (optional but harmless)
CONFIG_ZMK_KEYBOARD_NAME="Sofle"

# --- BLUETOOTH / WIRELESS
CONFIG_BT=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT=y

# IMPORTANT: lower power, better battery
CONFIG_BT_CTLR_TX_PWR_PLUS_0=y

# --- POWER MANAGEMENT (VERY IMPORTANT)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=300000

# --- ENCODERS (you want these)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
