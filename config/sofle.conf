CONFIG_ZMK_KEYBOARD_NAME="Sofle"

CONFIG_BT=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_STATUS=y
CONFIG_ZMK_SPLIT=y

CONFIG_BT_CTLR_TX_PWR_PLUS_0=y

CONFIG_ZMK_SLEEP=y
